<!DOCTYPE html>
<html>
  <head>
    <title>TodoList</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link id="theme-css" rel="stylesheet" href="hacker.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#0d0d0d">
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; 
                  script-src 'self'; 
                  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                  font-src https://fonts.gstatic.com;">
  </head>

  <body>
    <h1></h1>
    <p class="boj-subtitle">RIP BOJ_SWAN</p>
    
    <div class="boj-nav">
      <span class="boj-nav-item">전체</span>
      <span class="boj-nav-item">제출</span>
      <span class="boj-nav-item">맞힌 사람</span>
      <span class="boj-nav-item">숏코딩</span>
      <span class="boj-nav-item">재채점 결과</span>
      <span class="boj-nav-item">채점 현황</span>
      <span class="boj-nav-item active">내 제출</span>
      <span class="boj-nav-item">난이도 기여</span>
      <span class="boj-nav-item">질문 게시판 (20)</span>
      <span class="boj-nav-item">타이머▼</span>
    </div>

    <div id="input-area"> 
      <div class="select-row">
        <select id="category-select">
          <option value="기타">기타</option>
          <option value="일퀘">일퀘</option>
          <option value="과제">과제</option>
          <option value="공부">공부</option>
          <option value="개발">개발</option>
        </select>
        <input id="deadline-input" type="date">
      </div>

      <div class="input-row">
        <input id="todo-input" type="text" maxlength="100" placeholder="너 또 까먹을거지">
        <button id="add-btn">추가</button>
      </div>
    </div>

    <div class="filter-row">
      <select id="category-filter">
        <option value="전체">전체</option>
        <option value="기타">기타</option>
        <option value="일퀘">일퀘</option>
        <option value="숙제">과제</option>
        <option value="공부">공부</option>
        <option value="개발">개발</option>
      </select>
      <select id="completed-filter">
        <option value="전체">전체</option>
        <option value="미완료">미완료</option>
        <option value="완료">완료</option>
      </select>
      <select id="date-sort">
        <option value="default">기본순</option>
        <option value="asc">날짜 빠른순</option>
        <option value="desc">날짜 느린순</option>
      </select>
    </div>

    <div class="count-row">
      <span id="todo-count"></span>
      <span id="count-bar"></span>
    </div>

    <ul id="todo-list"></ul>

    <script src="index.js"></script>
  </body>
</html>
